services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://evolving:evolving@db:5432/evolving
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: evolving
      POSTGRES_PASSWORD: evolving
      POSTGRES_DB: evolving
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
